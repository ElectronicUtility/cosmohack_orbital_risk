<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планирование ВКД · исследовательский прототип</title>
<style>
*{box-sizing:border-box}:root{font-family:system-ui,sans-serif;color:#e9f1fb;background:#101b2b}body{max-width:1100px;margin:auto;padding:20px}h1{font-size:1.9rem}p{line-height:1.5;color:#b8c9dd;overflow-wrap:anywhere}.panel{background:#192a40;border:1px solid #35506f;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:10px 0;font-weight:600;min-width:0}[hidden]{display:none!important}input,select,button{font:inherit;border-radius:6px;border:1px solid #738ba5;padding:8px;background:#102035;color:#fff;max-width:100%}label>input:not([type=checkbox]),label>select{display:block;width:100%;margin-top:5px}button{background:#237e9a;cursor:pointer;margin-top:12px}button:hover{background:#3098b6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;min-width:0}.muted{color:#a7bad2}.alert{color:#ffc479}.bad{color:#ff9b97}.ok{color:#9bdfc8}a{color:#88d6f1;overflow-wrap:anywhere}details{background:#13253a;padding:10px;margin:8px 0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}.bar{height:10px;border-radius:6px;background:#35506f;overflow:hidden}.bar span{display:block;height:100%;background:#e9a95c}.small{font-size:.9rem}#status{min-height:1.4rem}
</style></head><body>
<h1>ВКД · внешние условия и сравнение окон</h1>
<p>Исследовательская поддержка решения для аналитика. Результат описывает только выбранные факторы и не является разрешением на выход.</p>
<form id="form" class="panel"><div class="grid">
<label>Режим<select id="mode"><option value="current">Текущая обстановка</option><option value="reconstruction">Историческая реконструкция</option><option value="replay">Прогноз из прошлого</option></select></label>
<label>Начало ВКД, UTC<input id="start" type="datetime-local" required></label>
<label>Длительность, часы<input id="duration" type="number" min="1" max="8" step="0.5" value="6" required></label>
<label>Допустимый перенос старта, часы<input id="search" type="number" min="0.5" max="24" step="0.5" value="12" required></label>
<label id="cutoff-label" hidden>Момент отсечения, UTC<input id="cutoff" type="datetime-local"></label>
<label>Требуется прямой солнечный свет<input id="sunlight" type="checkbox" checked></label>
</div><button type="submit">Рассчитать и сохранить</button> <button type="button" id="refresh">Обновить источники и рассчитать</button><p id="status" role="status"></p></form>
<main id="result"></main>
<script>
const $=id=>document.getElementById(id), fmt=t=>new Date(t).toISOString().replace('T',' ').slice(0,16)+' UTC';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={space_weather:'Космическая погода',lighting:'Освещённость',attention:'Требует внимания',insufficient:'Недостаточно данных',forecast_below_experimental_threshold:'Ниже экспериментального порога',no_restriction_detected:'Ограничение не выявлено',complete:'Полное покрытие',partial_or_absent:'Неполное покрытие',fresh:'Актуальный ответ',cached:'Кеш',stale:'Устаревший кеш',archive:'Архив',current:'Текущая орбита',historical_reconstruction:'Историческая реконструкция'};
const label=s=>escapeHTML(labels[s]||s);
const utcValue=d=>new Date(d).toISOString().slice(0,16);
$('start').value=utcValue(Date.now()+3600000);
$('cutoff').value=utcValue(Date.now());
$('mode').addEventListener('change',()=>{let h=$('mode').value!=='current';$('cutoff-label').hidden=$('mode').value!=='replay';if(h&&$('start').value.slice(0,4)!=='2024'){$('start').value='2024-05-10T06:00';$('cutoff').value='2024-05-10T00:00'}if(!h&&$('start').value.slice(0,4)==='2024')$('start').value=utcValue(Date.now()+3600000)});
function utc(s){return s+':00Z'}
function factor(f,duration){let color=f.state==='insufficient'?'bad':f.state==='attention'?'alert':'ok';let width=f.overlap_minutes===null?0:Math.min(100,100*f.overlap_minutes/duration);return `<div class="panel"><b>${label(f.mechanism)}</b> · <span class="${color}">${label(f.state)}</span><p>Покрытие ${f.covered_minutes.toFixed(0)} мин · пересечение ${f.overlap_minutes===null?'неизвестно':f.overlap_minutes.toFixed(0)+' мин'} · ${label(f.completeness)} · ${label(f.freshness)}</p><div class="bar" aria-label="Доля окна с отмеченным условием"><span style="width:${width}%"></span></div>${f.evidence.map(e=>`<details><summary>Исходные данные и правило</summary><pre>${escapeHTML(JSON.stringify(e,null,2))}</pre></details>`).join('')}<details><summary>Ограничения</summary>${f.limitations.map(s=>`<p>${escapeHTML(s)}</p>`).join('')}</details></div>`}
function render(a){let c=a.comparison;let title=c.outcome==='preferred'?`Предпочтительно окно ${c.preferred_index+1}`:c.outcome==='equivalent'?'Окна равнозначны':c.outcome==='insufficient'?'Недостаточно данных для выбора':'Компромисс между факторами';$('result').innerHTML=`<div class="panel"><h2>${title}</h2><p>${c.reasons.map(escapeHTML).join(' ')}</p><p class="small">Версия расчёта ${escapeHTML(a.algorithm_version)} · сохранено ${fmt(a.created_at)}</p><a href="/api/analyses/${a.id}/export.json">JSON</a> · <a href="/api/analyses/${a.id}/export.html">Читаемый отчёт</a> · <a href="/api/analyses/${a.id}">Открыть сохранённый расчёт</a></div>${a.windows.map((w,i)=>`<section><h2>Окно ${i+1}: ${fmt(w.window.start)} — ${fmt(w.window.end)}</h2><p>Траектория: ${w.orbit.length} точек; ${w.orbit.length?`эпоха элементов ${fmt(w.orbit[0].epoch)}, ${label(w.orbit[0].classification)}`:'подходящих элементов нет'}</p><div class="grid">${w.factors.map(f=>factor(f,(new Date(w.window.end)-new Date(w.window.start))/60000)).join('')}</div>${w.limitations.map(s=>`<p class="alert">${escapeHTML(s)}</p>`).join('')}</section>`).join('')}<div class="panel"><h2>Использованные записи</h2>${a.source_records.map(r=>`<p><a href="${escapeHTML(r.url)}">${escapeHTML(r.source)}</a> · опубликовано ${r.published_at?fmt(r.published_at):'неизвестно'} · получено ${fmt(r.retrieved_at)} · ${escapeHTML(r.cache_state)} · SHA-256 ${escapeHTML(r.content_sha256)}</p>`).join('')||'<p>Записей нет</p>'}</div>`}
async function submit(refresh=false){$('status').textContent='Получаем данные и рассчитываем окна…';$('result').innerHTML='';try{let body={mode:$('mode').value,start:utc($('start').value),duration_hours:Number($('duration').value),search_hours:Number($('search').value),requires_sunlight:$('sunlight').checked,refresh};if(body.mode==='replay')body.cutoff=utc($('cutoff').value);let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let a=await r.json();if(!r.ok)throw Error(JSON.stringify(a.detail));render(a);$('status').textContent='Расчёт сохранён.'}catch(e){$('status').textContent='Ошибка: '+e.message}}
$('form').addEventListener('submit',e=>{e.preventDefault();submit()});$('refresh').onclick=()=>submit(true);
</script></body></html>
